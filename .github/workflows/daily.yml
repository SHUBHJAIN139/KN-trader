name: KN Smart TP SL Trader — Daily Signal Run

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST (Mon-Fri only) - runs automatically even when PC is off
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Timeframe(s) to scan'
        type: choice
        options:
          - '4h 1w'
          - '4h'
          - '1w'
          - '1d'
          - '1d 4h 1w'
        default: '4h 1w'
      vol_filter:
        description: 'Volume Filter Mode'
        type: choice
        options:
          - 'with_filter_1.5'
          - 'no_filter_0.0'
        default: 'with_filter_1.5'
      top_n:
        description: 'Top N volume stocks to scan from Chartink'
        type: string
        default: '50'

jobs:
  run-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials file
        run: |
          mkdir -p credentials
          echo "$GOOGLE_CREDENTIALS_JSON" > credentials/service-account.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Run signals pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials/service-account.json
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'KN Trader Signals' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          TF="${{ inputs.timeframe || '4h 1w' }}"
          TOP="${{ inputs.top_n || '50' }}"
          
          if [ "${{ inputs.vol_filter }}" = "no_filter_0.0" ]; then
            python -m src.pipeline --timeframe $TF --top-n $TOP --no-vol-filter
          else
            python -m src.pipeline --timeframe $TF --top-n $TOP --min-vol-ratio 1.5
          fi
